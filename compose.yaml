services:
  # rapidrabbitpancakecounter.api:
  #   image: rapidrabbitpancakecounter.api
  #   build:
  #     context: .
  #     dockerfile: RapidRabbitPancakeCounter.Api/Dockerfile

  # Use postgres/example user/password credentials
  db:
    image: postgres
    restart: no
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: rabbit
      POSTGRES_USER: rabbit
      POSTGRES_DB: rabbit
    ports:
    - "5432:5432"

  adminer:
    image: adminer
    restart: no
    ports:
      - 8080:8080
      